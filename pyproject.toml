[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "asr-nl"
version = "0.1.0"
description = "Dutch ASR Leaderboard Evaluation and ranking of ASR models for Dutch"
readme = "README.md"
requires-python = "==3.12.*"
authors = [
    {name = "tvosch", email = "t.vanosch@hotmail.com"}
]
license = {text = "Apache 2.0"}
dependencies = [
    "accelerate==1.13.0",
    "datasets==2.21.0",
    "evaluate==0.4.6",
    "elevenlabs==2.43.0",
    "gradio==6.13.0",
    "jiwer==4.0.0",
    "librosa>=0.11.0",
    "murmel>=0.1.0",
    "nemo-toolkit==2.7.3",
    "num2words==0.5.14",
    "openai==2.33.0",
    "pandas==2.2.3",
    "soundfile==0.13.1",
    "torch==2.10.0",
    "torchaudio==2.10.0",
    "torchcodec==0.10.0",
    "transformers==5.3.0",
    "vllm==0.19.1",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
asr-nl-eval = "asr_nl.eval:main"
asr-nl-show = "asr_nl.cli.show_table:main"
asr-nl-download = "asr_nl.cli.download_datasets:main"
asr-nl-app = "asr_nl.gradio.app:launch"

[project.urls]
Homepage = "https://huggingface.co/spaces/tvosch/Dutch-ASR-Leaderboard"
Repository = "https://github.com/tvosch/Dutch-ASR-eaderboard"

[tool.hatch.build.targets.wheel]
packages = ["src/asr_nl"]

[tool.uv]
default-groups = ["dev"]
override-dependencies = [
    "transformers==5.3.0",
    "fsspec==2024.12.0",
]
